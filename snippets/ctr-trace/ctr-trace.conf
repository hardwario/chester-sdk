# Enable the ctr_trace subsystem and its required dependencies. CTR_TRACE uses
# `depends on` (not `select`), so the dependencies are enabled explicitly here.
#
# CTR_TRACE itself is NOT force-enabled here: it has `default y` gated on the
# `ctr,trace_mem` chosen node (added by the overlay), so it turns on
# automatically where its dependencies are met and stays off silently elsewhere
# (e.g. the MCUboot image, which uses minimal logging) without a Kconfig
# unmet-dependency warning.

CONFIG_LOG=y
CONFIG_HWINFO=y

CONFIG_RETAINED_MEM=y
# RETAINED_MEM_ZEPHYR_RAM defaults to y once the retained-ram DT node exists.

# ctr_trace writes the fault marker from the fatal-error handler (interrupts
# locked), so the retained_mem driver must not use an internal mutex.
CONFIG_RETAINED_MEM_MUTEX_FORCE_DISABLE=y
