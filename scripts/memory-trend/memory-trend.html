const svg = document.getElementById("chart");
const wrap = document.getElementById("chartwrap");
const tooltip = document.getElementById("tooltip");
const select = document.getElementById("app");
const NS = "http://www.w3.org/2000/svg";
const PAD = { l: 52, r: 64, t: 12, b: 30 };
const kB = b => b / 1024;
const fmt = v => Math.round(v).toLocaleString("en-US");

const apps = Object.keys(DATA).sort();
for (const a of apps) {
  const o = document.createElement("option");
  o.value = a; o.textContent = a;
  select.appendChild(o);
}

let rows = [];        // [{d: Date, iso, flash, flashSize, ram, ramSize}]
let px = [], w = 0, h = 0, x0 = 0, x1 = 1, yMax = 1;
let hoverIdx = -1;

function cssVar(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function el(name, attrs) {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
function X(t) { return PAD.l + (t - x0) / (x1 - x0 || 1) * (w - PAD.l - PAD.r); }
function Y(v) { return h - PAD.b - v / yMax * (h - PAD.t - PAD.b); }

function niceTicks(max, n) {
  const raw = max / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => max / s <= n) || 10 * mag;
  const out = [];
  for (let v = 0; v <= max + 1e-9; v += step) out.push(v);
  return out;
}

function render() {
  const app = select.value;
  rows = (DATA[app] || []).map(r => ({
    d: new Date(r[0] + "T00:00:00Z"), iso: r[0],
    flash: kB(r[1]), flashSize: r[2], ram: kB(r[3]), ramSize: r[4],
  }));
  svg.textContent = "";
  hideTooltip();
  if (!rows.length) return;

  const rect = svg.getBoundingClientRect();
  w = rect.width; h = rect.height;
  svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
  x0 = rows[0].d.getTime(); x1 = rows[rows.length - 1].d.getTime();
  yMax = Math.max(...rows.map(r => r.flash)) * 1.1;

  const grid = cssVar("--grid"), muted = cssVar("--muted"),
        baseline = cssVar("--baseline"), ink2 = cssVar("--ink-2"),
        surface = cssVar("--surface"),
        cFlash = cssVar("--flash"), cRam = cssVar("--ram");

  for (const v of niceTicks(yMax, 7)) {
    const y = Y(v);
    svg.appendChild(el("line", { x1: PAD.l, x2: w - PAD.r, y1: y, y2: y,
                                 stroke: grid, "stroke-width": 1 }));
    const t = el("text", { x: PAD.l - 8, y: y + 4, "text-anchor": "end",
                           fill: muted, "font-size": 11 });
    t.textContent = fmt(v);
    svg.appendChild(t);
  }
  const yl = el("text", { x: PAD.l - 8, y: PAD.t + 2, "text-anchor": "end",
                          fill: muted, "font-size": 11 });
  yl.textContent = "kB";
  svg.appendChild(yl);

  const months = Math.max(1, Math.round((x1 - x0) / 2592e6));
  const stepM = Math.max(1, Math.ceil(months / 8));
  const first = new Date(rows[0].d);

  for (let m = new Date(first); m.getTime() <= x1;
       m.setUTCMonth(m.getUTCMonth() + stepM)) {
    if (m.getTime() < x0) continue;
    const x = X(m.getTime());
    svg.appendChild(el("line", { x1: x, x2: x, y1: h - PAD.b, y2: h - PAD.b + 4,
                                 stroke: baseline, "stroke-width": 1 }));
    const t = el("text", { x, y: h - PAD.b + 17, "text-anchor": "middle",
                           fill: muted, "font-size": 11 });
    t.textContent = m.toISOString().slice(0, 7);
    svg.appendChild(t);
  }
  svg.appendChild(el("line", { x1: PAD.l, x2: w - PAD.r, y1: h - PAD.b,
                               y2: h - PAD.b, stroke: baseline, "stroke-width": 1 }));

  px = rows.map(r => X(r.d.getTime()));
  for (const [key, color] of [["flash", cFlash], ["ram", cRam]]) {
    const pts = rows.map((r, i) => `${px[i]},${Y(r[key])}`).join(" ");

                                     "stroke-width": 2, "stroke-linejoin": "round" }));
    const last = rows[rows.length - 1];
    const t = el("text", { x: px[px.length - 1] + 8, y: Y(last[key]) + 4,

    t.textContent = fmt(last[key]) + " kB";
    svg.appendChild(t);

  const hover = el("g", { visibility: "hidden" });
  hover.appendChild(el("line", { class: "xline", y1: PAD.t, y2: h - PAD.b,
                                 stroke: baseline, "stroke-width": 1 }));
  for (const color of [cFlash, cRam]) {
    hover.appendChild(el("circle", { r: 4.5, fill: color, stroke: surface,
                                     "stroke-width": 2 }));
  }

  svg._hover = hover;

  buildTable();
}

function buildTable() {
  const table = document.getElementById("table");
  table.textContent = "";
  const head = table.insertRow();
  for (const c of ["Date", "FLASH [kB]", "FLASH [%]", "RAM [kB]", "RAM [%]"]) {
    const th = document.createElement("th");
    th.textContent = c;
    head.appendChild(th);
  }
  for (const r of rows) {
    const tr = table.insertRow();
    for (const v of [r.iso, fmt(r.flash),
                     (100 * r.flash * 1024 / r.flashSize).toFixed(1),
                     fmt(r.ram), (100 * r.ram * 1024 / r.ramSize).toFixed(1)]) {
      tr.insertCell().textContent = v;
    }
  }
}

function showIdx(i) {
  hoverIdx = i;
  const r = rows[i], x = px[i];
  const hover = svg._hover;
  hover.setAttribute("visibility", "visible");
  const [line, dotF, dotR] = hover.children;
  line.setAttribute("x1", x); line.setAttribute("x2", x);
  dotF.setAttribute("cx", x); dotF.setAttribute("cy", Y(r.flash));
  dotR.setAttribute("cx", x); dotR.setAttribute("cy", Y(r.ram));

  tooltip.textContent = "";
  const d = document.createElement("div");
  d.className = "date"; d.textContent = r.iso;
  tooltip.appendChild(d);
  for (const [label, val, size, varName] of
       [["FLASH", r.flash, r.flashSize, "--flash"],
        ["RAM", r.ram, r.ramSize, "--ram"]]) {
    const row = document.createElement("div");
    row.className = "row";
    const key = document.createElement("span");
    key.className = "key"; key.style.borderColor = cssVar(varName);
    const val_ = document.createElement("span");
    val_.className = "val"; val_.textContent = fmt(val) + " kB";
    const pct = document.createElement("span");
    pct.className = "pct";
    pct.textContent = (100 * val * 1024 / size).toFixed(1) + " %";
    const lbl = document.createElement("span");
    lbl.className = "lbl"; lbl.textContent = label;
    row.append(key, val_, pct, lbl);
    tooltip.appendChild(row);
  }
  tooltip.style.display = "block";
  const tw = tooltip.offsetWidth;
  const left = x + 14 + tw > w ? x - tw - 14 : x + 14;
  tooltip.style.left = left + "px";
  tooltip.style.top = Math.max(0, Y(r.flash) - 20) + "px";
}

function hideTooltip() {
  hoverIdx = -1;
  tooltip.style.display = "none";
  if (svg._hover) svg._hover.setAttribute("visibility", "hidden");
}

svg.addEventListener("pointermove", ev => {
  if (!rows.length) return;
  const x = ev.clientX - svg.getBoundingClientRect().left;
  let best = 0;
  for (let i = 1; i < px.length; i++)
    if (Math.abs(px[i] - x) < Math.abs(px[best] - x)) best = i;
  showIdx(best);
});
svg.addEventListener("pointerleave", hideTooltip);
svg.addEventListener("keydown", ev => {
  if (!rows.length) return;
  if (ev.key === "ArrowRight" || ev.key === "ArrowLeft") {
    const d = ev.key === "ArrowRight" ? 1 : -1;
    showIdx(Math.min(rows.length - 1, Math.max(0, (hoverIdx < 0 ? rows.length - 1 : hoverIdx) + d)));
    ev.preventDefault();
  } else if (ev.key === "Escape") {
    hideTooltip();
  }
});
svg.addEventListener("blur", hideTooltip);
select.addEventListener("change", render);
new ResizeObserver(() => render()).observe(wrap);
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", render);
render();
</script>
