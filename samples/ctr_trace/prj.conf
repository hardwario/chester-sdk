CONFIG_CTR_DEFAULTS=y
CONFIG_CTR_LOG=y
CONFIG_CTR_SHELL=y

# ctr_trace itself and its retained-RAM region come from the `ctr-trace`
# snippet applied by CMakeLists.txt.

# Hardware watchdog, matching how real CHESTER applications run: the heartbeat
# loop feeds it, and a hang (see `demo hang`) lets it expire and reset the SoC.
CONFIG_CTR_WDOG=y
