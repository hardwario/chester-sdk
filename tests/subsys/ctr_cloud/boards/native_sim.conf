CONFIG_FLASH_SIMULATOR=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# native_sim has a CSPRNG-capable entropy driver, so the Mbed TLS PSA
# provider works without the external-RNG fallback. On this non-Nordic target
# PSA_CRYPTO selects the Mbed TLS provider (CONFIG_PSA_CRYPTO_PROVIDER_MBEDTLS).
CONFIG_PSA_CRYPTO=y
CONFIG_ENTROPY_GENERATOR=y
