CONFIG_ZTEST=y
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_LOG=y
CONFIG_LOG_FUNC_NAME_PREFIX_ERR=y
CONFIG_LOG_FUNC_NAME_PREFIX_WRN=y
CONFIG_LOG_FUNC_NAME_PREFIX_INF=y
CONFIG_LOG_FUNC_NAME_PREFIX_DBG=y

CONFIG_REQUIRES_FULL_LIBC=y

# Retained memory framework (the mock device provides the storage; the real
# zephyr-ram driver is disabled in boards/native_sim.conf).
CONFIG_RETAINED_MEM=y

CONFIG_HWINFO=y

# The subsystem source is compiled directly into each test via #include
# "ctr_trace.c" (white-box access to its statics), so it must NOT also be linked
# through the chester module library -- that would double-define its global
# symbols (fatal-error handler, log backend, shell command set). The board
# overlay enables the chosen `ctr,trace_mem` node, which would otherwise make the
# subsystem Kconfig default to y, so force it off. The CONFIG_CTR_TRACE_* knobs
# the source needs are supplied as compile definitions in CMakeLists.txt.
CONFIG_CTR_TRACE=n

# Dummy shell backend so no UART/serial is needed.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=4096
CONFIG_SHELL_LOG_BACKEND=n

CONFIG_HEAP_MEM_POOL_SIZE=4096
