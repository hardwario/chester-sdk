# The mock in src/mock_retmem.c provides the retained_mem device, so disable the
# real zephyr-ram driver (it would otherwise also bind the chosen node).
CONFIG_RETAINED_MEM_ZEPHYR_RAM=n

# ctr_trace requires the retained_mem mutex to be disabled (its fatal-error
# handler writes the fault marker from a context with interrupts locked).
CONFIG_RETAINED_MEM_MUTEX_FORCE_DISABLE=y
