
common:
  tags:
      - chester
  platform_allow: native_sim
  integration_platforms:
    - native_sim

tests:
  subsys.ctr_lte_v2.parser:
    extra_args: CONFIG_TEST_FEATURE_PARSING=y

  subsys.ctr_lte_v2.stack_overrides_config:
    extra_args: CONFIG_TEST_FEATURE_STACK_OVERRIDES_CONFIG=y

  subsys.ctr_lte_v2.stack_default:
    extra_args: CONFIG_TEST_FEATURE_STACK=y

  subsys.ctr_lte_v2.stack_fplmn_erase_fails:
    extra_args: CONFIG_TEST_FEATURE_STACK_FPLMN_ERASE_FAILS=y

  subsys.ctr_lte_v2.txn_give_up_in_recv:
    extra_args: CONFIG_TEST_FEATURE_TXN_GIVE_UP_IN_RECV=y

  subsys.ctr_lte_v2.txn_give_up_in_attach:
    extra_args: CONFIG_TEST_FEATURE_TXN_GIVE_UP_IN_ATTACH=y

  subsys.ctr_lte_v2.txn_give_up_in_error:
    extra_args: CONFIG_TEST_FEATURE_TXN_GIVE_UP_IN_ERROR=y

  subsys.ctr_lte_v2.txn_give_up_in_send:
    extra_args: CONFIG_TEST_FEATURE_TXN_GIVE_UP_IN_SEND=y

  subsys.ctr_lte_v2.txn_give_up_in_xsend:
    extra_args: CONFIG_TEST_FEATURE_TXN_GIVE_UP_IN_XSEND=y

  subsys.ctr_lte_v2.txn_lock_busy:
    extra_args: CONFIG_TEST_FEATURE_TXN_LOCK_BUSY=y
