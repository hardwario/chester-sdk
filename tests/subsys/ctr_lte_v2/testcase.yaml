  subsys.ctr_lte_v2.txn_give_up_in_attach:
    extra_args: CONFIG_TEST_FEATURE_TXN_GIVE_UP_IN_ATTACH=y

  subsys.ctr_lte_v2.txn_give_up_in_error:
    extra_args: CONFIG_TEST_FEATURE_TXN_GIVE_UP_IN_ERROR=y

  subsys.ctr_lte_v2.txn_give_up_in_send:
    extra_args: CONFIG_TEST_FEATURE_TXN_GIVE_UP_IN_SEND=y

  subsys.ctr_lte_v2.txn_give_up_in_xsend:
    extra_args: CONFIG_TEST_FEATURE_TXN_GIVE_UP_IN_XSEND=y

  subsys.ctr_lte_v2.txn_lock_busy:
    extra_args: CONFIG_TEST_FEATURE_TXN_LOCK_BUSY=y

  subsys.ctr_lte_v2.txn_cscon_again_in_recv:
