  subsys.ctr_lte_v2.txn_error_no_socket:
    extra_args: CONFIG_TEST_FEATURE_TXN_ERROR_NO_SOCKET=y

  subsys.ctr_lte_v2.txn_disabled:
    extra_args: CONFIG_TEST_FEATURE_TXN_DISABLED=y

  subsys.ctr_lte_v2.txn_no_cscon:
    extra_args: CONFIG_TEST_FEATURE_TXN_NO_CSCON=y

  subsys.ctr_lte_v2.txn_cscon_timer:
