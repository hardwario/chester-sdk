image: "hardwario/nrf-connect-sdk-build:v3.4.0-1"

variables:
  CI_DEBUG_TRACE: "false"

.build_template:
  stage: build
  variables:
    GIT_STRATEGY: none
    WEST_AUTO_CACHE: /shared-cache/west-auto
  before_script:
    - set -euo pipefail
    - mkdir -p /build
    - cd /build
    - git clone -n "${CI_REPOSITORY_URL}" chester
    - git -C chester config advice.detachedHead false
    - git -C chester checkout "${CI_COMMIT_SHA}"
    - west init -l --mf west.yml chester
    # flock: concurrent jobs must not sync the shared mirrors at the same time
    - flock -w 1800 "${WEST_AUTO_CACHE}.lock" west update --auto-cache "${WEST_AUTO_CACHE}"
    - west config build.board chester

tests:
  extends: .build_template
  script:
    - ./zephyr/scripts/twister --testsuite-root chester/tests -c -i -v -p native_sim

samples:
  extends: .build_template
  script:
    - |
      for sample in chester/samples/*/; do
        [[ "$sample" == "chester/samples/_legacy/" ]] && continue
        printf '\n\033[1;36m%s\033[0m\n' "**************************************************"
        printf '\033[1;36mBuild: %s\033[0m\n' "${sample%/}"
        west build -d "${sample}/build" "${sample}"
      done

applications:
  extends: .build_template
  script:
    - |
      for application in chester/applications/*/; do
        [[ "$application" == "chester/applications/_legacy/" ]] && continue
        printf '\n\033[1;36m%s\033[0m\n' "**************************************************"
        printf '\033[1;36mBuild: %s\033[0m\n' "${application%/}"
        west build -d "${application}/build" "${application}"
        if [[ -f "${application}/build/merged_chester_nrf52840.hex" ]]; then
          echo "Application ${application} built successfully"
        else
          echo "Application ${application} build failed - missing merged_chester_nrf52840.hex"
          exit 1
        fi
      done
