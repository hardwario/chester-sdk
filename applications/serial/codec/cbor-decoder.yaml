version: 2
type: decoder
name: com.hardwario.chester.app.serial
schema:
  - message:
      - version:
      - sequence:
      - timestamp:
  - attribute:
      - vendor_name:
      - product_name:
      - hw_variant:
      - hw_revision:
      - fw_version:
      - serial_number:
  - system:
      - uptime:
  - power:
      - external:
          - source:
              - $enum:
                  - "none"
                  - "ctr-z"
                  - "ctr-x4-a"
                  - "ctr-x4-b"
                  - "ctr-x10"
          - line:
              - $enum:
                  - "unknown"
                  - "disconnected"
                  - "connected"
          - line_voltage:
              - $div: 1000
              - $fpp: 2
          - backup_voltage:
              - $div: 1000
              - $fpp: 2
          - events:
              - $tso:
                  - line:
                      - $enum:
                          - "unknown"
                          - "disconnected"
                          - "connected"
      - system:
          - voltage_rest:
              - $div: 1000
              - $fpp: 2
          - voltage_load:
              - $div: 1000
              - $fpp: 2
          - current_load:
  - network:
      - parameter:
          - eest:
          - ecl:
          - rsrp:
          - rsrq:
          - snr:
          - plmn:
          - cid:
          - band:
          - earfcn:
  - thermometer:
      - temperature:
          - $div: 100
          - $fpp: 2
  - accelerometer:
      - accel_x:
          - $div: 1000
          - $fpp: 2
      - accel_y:
          - $div: 1000
          - $fpp: 2
      - accel_z:
          - $div: 1000
          - $fpp: 2
      - orientation:
  - devices:
      - device:
      - type:
      - type_name:
      - addr:
      - data:
          - timestamp:
          - co2_percent:
              - $div: 1000
              - $fpp: 3
          - temperature:
              - $div: 100
              - $fpp: 2
          - pressure:
              - $div: 10
              - $fpp: 1
          - voltage:
              - $div: 100
              - $fpp: 2
          - current:
              - $div: 1000
              - $fpp: 3
          - power:
          - energy:
          - frequency:
              - $div: 100
              - $fpp: 2
          - energy_in:
          - energy_out:
          - voltage_l1:
              - $div: 100
              - $fpp: 2
          - voltage_l2:
              - $div: 100
              - $fpp: 2
          - voltage_l3:
              - $div: 100
              - $fpp: 2
          - current_l1:
              - $div: 1000
              - $fpp: 3
          - current_l2:
              - $div: 1000
              - $fpp: 3
          - current_l3:
              - $div: 1000
              - $fpp: 3
          - power_l1:
          - power_l2:
          - power_l3:
          - card_uid:
          - flow_s:
              - $div: 10000
              - $fpp: 4
          - flow_m:
              - $div: 10000
              - $fpp: 4
          - flow_h:
              - $div: 10000
              - $fpp: 4
          - velocity:
              - $div: 10000
              - $fpp: 4
          - total_positive:
              - $div: 1000
              - $fpp: 3
          - total_negative:
              - $div: 1000
              - $fpp: 3
          - total_net:
              - $div: 1000
              - $fpp: 3
          - energy_hot:
              - $div: 1000
              - $fpp: 3
          - energy_cold:
              - $div: 1000
              - $fpp: 3
          - temp_inlet:
              - $div: 100
              - $fpp: 2
          - temp_outlet:
              - $div: 100
              - $fpp: 2
          - signal_quality:
          - power_apparent:
          - power_reactive:
          - power_factor:
          - power_factor_l1:
          - power_factor_l2:
          - power_factor_l3:
          # Both radon probes report through these two keys. The averaging window differs
          # by probe - RPP-R 1 h, RPP-U 0.5 h - and is read from the device's `type_name`,
          # so it does not belong in the key name as well.
          - radon_concentration:
          - radon_concentration_day:
          - humidity:
          - pv1_power:
          - pv2_power:
          - bat_power:
          - bat_temp:
          - bat_soc:
          - feedin_power:
          - feedin_energy:
              - $div: 100
              - $fpp: 2
          - consume_energy:
              - $div: 100
              - $fpp: 2
          - eps_power_l1:
          - eps_power_l2:
          - eps_power_l3:
          # Appended for the Piketronic RPP-U. Keys are numbered by position in this
          # document, so inserting or removing one renumbers every key that follows -
          # including the whole `ble_tags` block below. That is safe as long as this file and
          # the firmware ship together: each image carries its own decoder blob and the cloud
          # swaps it in on a hash mismatch (see ctr_cloud.c). What it does invalidate is any
          # decoder kept by hand out of band, so prefer appending here over inserting above.
          #
          # The probe's own accumulator, in volts to 3 decimals. It cannot reuse `voltage`
          # above: that is $div 100 because the meters report mains voltage through it.
          - accumulator_voltage:
              - $div: 1000
              - $fpp: 3
      - sensecap:
          - air_temperature:
              - measurements:
                  - $tsp:
                      - min:
                          - $div: 1000
                          - $fpp: 2
                      - max:
                          - $div: 1000
                          - $fpp: 2
                      - avg:
                          - $div: 1000
                          - $fpp: 2
                      - mdn:
                          - $div: 1000
                          - $fpp: 2
          - air_humidity:
              - measurements:
                  - $tsp:
                      - min:
                          - $div: 1000
                          - $fpp: 2
                      - max:
                          - $div: 1000
                          - $fpp: 2
                      - avg:
                          - $div: 1000
                          - $fpp: 2
                      - mdn:
                          - $div: 1000
                          - $fpp: 2
          - barometric_pressure:
              - measurements:
                  - $tsp:
                      - min:
                          - $div: 1000
                          - $fpp: 2
                      - max:
                          - $div: 1000
                          - $fpp: 2
                      - avg:
                          - $div: 1000
                          - $fpp: 2
                      - mdn:
                          - $div: 1000
                          - $fpp: 2
          - wind_direction_avg:
              - measurements:
                  - $tsp:
                      - value:
                          - $div: 1000
                          - $fpp: 1
          - wind_speed_avg:
              - measurements:
                  - $tsp:
                      - min:
                          - $div: 1000
                          - $fpp: 2
                      - max:
                          - $div: 1000
                          - $fpp: 2
                      - avg:
                          - $div: 1000
                          - $fpp: 2
                      - mdn:
                          - $div: 1000
                          - $fpp: 2
          - light_intensity:
              - measurements:
                  - $tsp:
                      - min:
                          - $div: 1000
                          - $fpp: 0
                      - max:
                          - $div: 1000
                          - $fpp: 0
                      - avg:
                          - $div: 1000
                          - $fpp: 0
                      - mdn:
                          - $div: 1000
                          - $fpp: 0
          - accumulated_rainfall:
              - measurements:
                  - $tsp:
                      - value:
                          - $div: 1000
                          - $fpp: 2
          - pm2_5:
              - measurements:
                  - $tsp:
                      - min:
                          - $div: 1000
                          - $fpp: 1
                      - max:
                          - $div: 1000
                          - $fpp: 1
                      - avg:
                          - $div: 1000
                          - $fpp: 1
                      - mdn:
                          - $div: 1000
                          - $fpp: 1
          - pm10:
              - measurements:
                  - $tsp:
                      - min:
                          - $div: 1000
                          - $fpp: 1
                      - max:
                          - $div: 1000
                          - $fpp: 1
                      - avg:
                          - $div: 1000
                          - $fpp: 1
                      - mdn:
                          - $div: 1000
                          - $fpp: 1
          - co2:
              - measurements:
                  - $tsp:
                      - min:
                          - $div: 1000
                          - $fpp: 0
                      - max:
                          - $div: 1000
                          - $fpp: 0
                      - avg:
                          - $div: 1000
                          - $fpp: 0
                      - mdn:
                          - $div: 1000
                          - $fpp: 0
          - heater_temperature:
              - measurements:
                  - $tsp:
                      - value:
                          - $div: 1000
                          - $fpp: 2
          - tilt:
              - measurements:
                  - $tsp:
                      - value:
                          - $div: 1000
                          - $fpp: 0
      - cubic_6303:
          - tsp:
              - measurements:
                  - $tsp:
                      - min:
                      - max:
                      - avg:
                      - mdn:
          - pm1_0:
              - measurements:
                  - $tsp:
                      - min:
                      - max:
                      - avg:
                      - mdn:
          - pm2_5:
              - measurements:
                  - $tsp:
                      - min:
                      - max:
                      - avg:
                      - mdn:
          - pm10:
              - measurements:
                  - $tsp:
                      - min:
                      - max:
                      - avg:
                      - mdn:
          - gas_flow:
              - measurements:
                  - $tsp:
                      - min:
                          - $div: 100
                          - $fpp: 2
                      - max:
                          - $div: 100
                          - $fpp: 2
                      - avg:
                          - $div: 100
                          - $fpp: 2
                      - mdn:
                          - $div: 100
                          - $fpp: 2
  - ble_tags:
      - addr:
      - rssi:
      - voltage:
          - $div: 100
          - $fpp: 2
      - temperature:
          - measurements:
              - $tsp:
                  - min:
                      - $div: 100
                      - $fpp: 2
                  - max:
                      - $div: 100
                      - $fpp: 2
                  - avg:
                      - $div: 100
                      - $fpp: 2
                  - mdn:
                      - $div: 100
                      - $fpp: 2
      - humidity:
          - measurements:
              - $tsp:
                  - min:
                      - $div: 100
                      - $fpp: 2
                  - max:
                      - $div: 100
                      - $fpp: 2
                  - avg:
                      - $div: 100
                      - $fpp: 2
                  - mdn:
                      - $div: 100
                      - $fpp: 2
