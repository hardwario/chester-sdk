version: 2
type: decoder
name: com.hardwario.chester.control
schema:
  - message:
      - version:
      - sequence:
      - timestamp:
  - system:
      - uptime:
  - power:
      - external:
          - source:
              - $enum:
                  - "none"
                  - "ctr-z"
                  - "ctr-x4-a"
                  - "ctr-x4-b"
                  - "ctr-x10"
          - line:
              - $enum:
                  - "unknown"
                  - "disconnected"
                  - "connected"
          - line_voltage:
              - $div: 1000
              - $fpp: 2
          - backup_voltage:
              - $div: 1000
              - $fpp: 2
          - events:
              - $tso:
                  - line:
                      - $enum:
                          - "unknown"
                          - "disconnected"
                          - "connected"
      - system:
          - voltage_rest:
              - $div: 1000
              - $fpp: 2
          - voltage_load:
              - $div: 1000
              - $fpp: 2
          - current_load:
  - network:
      - parameter:
          - eest:
          - ecl:
          - rsrp:
          - rsrq:
          - snr:
          - plmn:
          - cid:
          - band:
          - earfcn:
  - thermometer:
      - temperature:
          - $div: 100
          - $fpp: 2
  - accelerometer:
      - accel_x:
          - $div: 1000
          - $fpp: 2
      - accel_y:
          - $div: 1000
          - $fpp: 2
      - accel_z:
          - $div: 1000
          - $fpp: 2
      - orientation:
  - trigger:
      - channel:
      - state:
          - $enum:
              - "inactive"
              - "active"
      - events:
          - $tso:
              - type:
                  - $enum:
                      - "deactivated"
                      - "activated"
  - counter:
      - channel:
      - value:
      - delta:
      - measurements:
          - $tsp:
              - value:
              - delta:
  - voltage:
      - channel:
      - measurements_div:
          - $key: "measurements"
          - $tsp:
              - min:
                  - $div: 100
                  - $fpp: 2
              - max:
                  - $div: 100
                  - $fpp: 2
              - avg:
                  - $div: 100
                  - $fpp: 2
              - mdn:
                  - $div: 100
                  - $fpp: 2
  - current:
      - channel:
      - measurements_div:
          - $key: "measurements"
          - $tsp:
              - min:
                  - $div: 100
                  - $fpp: 2
              - max:
                  - $div: 100
                  - $fpp: 2
              - avg:
                  - $div: 100
                  - $fpp: 2
              - mdn:
                  - $div: 100
                  - $fpp: 2
  - hygrometer:
      - temperature:
          - measurements_div:
              - $key: "measurements"
              - $tsp:
                  - min:
                      - $div: 100
                      - $fpp: 2
                  - max:
                      - $div: 100
                      - $fpp: 2
                  - avg:
                      - $div: 100
                      - $fpp: 2
                  - mdn:
                      - $div: 100
                      - $fpp: 2
      - humidity:
          - measurements_div:
              - $key: "measurements"
              - $tsp:
                  - min:
                      - $div: 100
                      - $fpp: 2
                  - max:
                      - $div: 100
                      - $fpp: 2
                  - avg:
                      - $div: 100
                      - $fpp: 2
                  - mdn:
                      - $div: 100
                      - $fpp: 2
  - w1_thermometers:
      - serial_number:
      - measurements_div:
          - $key: "measurements"
          - $tsp:
              - min:
                  - $div: 100
                  - $fpp: 2
              - max:
                  - $div: 100
                  - $fpp: 2
              - avg:
                  - $div: 100
                  - $fpp: 2
              - mdn:
                  - $div: 100
                  - $fpp: 2
  - soil_sensors:
      - serial_number:
      - temperature:
          - measurements:
              - $tsp:
                  - min:
                      - $div: 100
                      - $fpp: 2
                  - max:
                      - $div: 100
                      - $fpp: 2
                  - avg:
                      - $div: 100
                      - $fpp: 2
                  - mdn:
                      - $div: 100
                      - $fpp: 2
      - moisture:
          - measurements:
              - $tsp:
                  - min:
                  - max:
                  - avg:
                  - mdn:
  - ble_tags:
      - addr:
      - rssi:
      - voltage:
          - $div: 100
          - $fpp: 2
      - temperature:
          - measurements:
              - $tsp:
                  - min:
                      - $div: 100
                      - $fpp: 2
                  - max:
                      - $div: 100
                      - $fpp: 2
                  - avg:
                      - $div: 100
                      - $fpp: 2
                  - mdn:
                      - $div: 100
                      - $fpp: 2
      - humidity:
          - measurements:
              - $tsp:
                  - min:
                      - $div: 100
                      - $fpp: 2
                  - max:
                      - $div: 100
                      - $fpp: 2
                  - avg:
                      - $div: 100
                      - $fpp: 2
                  - mdn:
                      - $div: 100
                      - $fpp: 2
  - sensors:
      - index:
      - type:
      - channel_power:
      - channel_measure:
      - data:
          - sensor_voltage:
              - $div: 1000
              - $fpp: 2
          - flooded:
