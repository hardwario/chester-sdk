version: 2
type: decoder
name: com.hardwario.chester.app.demo
schema:
  - message:
    - version:
    - sequence:
    - timestamp:
  - system:
    - uptime:
  - power:
    - external:
      - source:
        - $enum:
          - "none"
          - "ctr-z"
          - "ctr-x4-a"
          - "ctr-x4-b"
          - "ctr-x10"
      - line:
        - $enum:
          - "unknown"
          - "disconnected"
          - "connected"
      - line_voltage:
        - $div: 1000
        - $fpp: 2
      - backup_voltage:
        - $div: 1000
        - $fpp: 2
      - events:
        - $tso:
          - line:
            - $enum:
              - "unknown"
              - "disconnected"
              - "connected"
    - system:
      - voltage_rest:
        - $div: 1000
        - $fpp: 2
      - voltage_load:
        - $div: 1000
        - $fpp: 2
      - current_load:
  - attribute:
    - vendor_name:
    - product_name:
    - hw_variant:
    - hw_revision:
    - fw_version:
    - serial_number:
  - network:
    - parameter:
      - eest:
      - ecl:
      - rsrp:
      - rsrq:
      - snr:
      - plmn:
      - cid:
      - band:
      - earfcn:
  - thermometer:
    - temperature:
      - $div: 100
      - $fpp: 2
  - accelerometer:
    - acceleration_x:
      - $div: 1000
      - $fpp: 2
    - acceleration_y:
      - $div: 1000
      - $fpp: 2
    - acceleration_z:
      - $div: 1000
      - $fpp: 2
    - orientation:
    