version: 2
type: decoder
name: com.hardwario.chester.app.scale
schema:
- message:
  - version: 
  - sequence: 
  - timestamp: 
- attribute:
  - vendor_name: 
  - product_name: 
  - hw_variant: 
  - hw_revision: 
  - fw_version: 
  - serial_number: 
- system:
  - uptime:
- power:
  - external:
    - source:
      - $enum:
        - "none"
        - "ctr-z"
        - "ctr-x4-a"
        - "ctr-x4-b"
        - "ctr-x10"
    - line:
      - $enum:
        - "unknown"
        - "disconnected"
        - "connected"
    - line_voltage:
      - $div: 1000
      - $fpp: 2
    - backup_voltage:
      - $div: 1000
      - $fpp: 2
    - events:
      - $tso:
        - line:
          - $enum:
            - "unknown"
            - "disconnected"
            - "connected"
  - system:
    - voltage_rest:
      - $div: 1000
      - $fpp: 2
    - voltage_load:
      - $div: 1000
      - $fpp: 2
    - current_load:
- network:
  - parameter:
    - eest: 
    - ecl: 
    - rsrp: 
    - rsrq: 
    - snr: 
    - plmn: 
    - cid: 
    - band: 
    - earfcn: 
- accelerometer:
  - accel_x:
    - $div: 1000
    - $fpp: 2
  - accel_y:
    - $div: 1000
    - $fpp: 2
  - accel_z:
    - $div: 1000
    - $fpp: 2
  - orientation: 
- thermometer:
  - temperature:
    - $div: 100
    - $fpp: 2
- weight:
  - $tso:
    - raw_result_a1: 
    - raw_result_a2: 
    - raw_result_b1: 
    - raw_result_b2: 
- people_counter:
  - $tso:
    - motion_counter: 
    - pass_counter_left: 
    - pass_counter_right: 
    - pass_counter_adult: 
    - pass_counter_child: 
    - stay_counter_adult: 
    - stay_counter_child: 
    - total_time_adult: 
    - total_time_child: 
    - consumed_energy: 
- ble_tags:
  - addr:
  - rssi:
  - voltage:
    - $div: 100
    - $fpp: 2
  - temperature:
    - measurements:
      - $tsp:
        - min:
          - $div: 100
          - $fpp: 2
        - max:
          - $div: 100
          - $fpp: 2
        - avg:
          - $div: 100
          - $fpp: 2
        - mdn:
          - $div: 100
          - $fpp: 2
  - humidity:
    - measurements:
      - $tsp:
        - min:
          - $div: 100
          - $fpp: 2
        - max:
          - $div: 100
          - $fpp: 2
        - avg:
          - $div: 100
          - $fpp: 2
        - mdn:
          - $div: 100
          - $fpp: 2