version: 2
type: decoder
name: com.hardwario.chester.app.push
schema:
- message:
  - version:
  - sequence:
  - timestamp:
- attribute:
  - vendor_name:
  - product_name:
  - hw_variant:
  - hw_revision:
  - fw_version:
  - serial_number:
- system:
  - uptime:
- power:
  - external:
    - source:
      - $enum:
        - "none"
        - "ctr-z"
        - "ctr-x4-a"
        - "ctr-x4-b"
        - "ctr-x10"
    - line:
      - $enum:
        - "unknown"
        - "disconnected"
        - "connected"
    - line_voltage:
      - $div: 1000
      - $fpp: 2
    - backup_voltage:
      - $div: 1000
      - $fpp: 2
    - events:
      - $tso:
        - line:
          - $enum:
            - "unknown"
            - "disconnected"
            - "connected"
  - system:
    - voltage_rest:
      - $div: 1000
      - $fpp: 2
    - voltage_load:
      - $div: 1000
      - $fpp: 2
    - current_load:
- network:
  - parameter:
    - eest:
    - ecl:
    - rsrp:
    - rsrq:
    - snr:
    - plmn:
    - cid:
    - band:
    - earfcn:
- thermometer:
  - temperature:
    - $div: 100
    - $fpp: 2
- accelerometer:
  - accel_x:
    - $div: 1000
    - $fpp: 2
  - accel_y:
    - $div: 1000
    - $fpp: 2
  - accel_z:
    - $div: 1000
    - $fpp: 2
  - orientation:
- buttons:
  - button:
    - $enum:
      - "button_x"
      - "button_1"
      - "button_2"
      - "button_3"
      - "button_4"
  - count_click:
  - count_hold:
  - events:
    - $tso:
      - type:
        - $enum:
          - "clicked"
          - "held"
  - last_press:
    - type:
      - $enum:
        - "clicked"
        - "held"
    - timestamp:
- tamper:
  - state:
    - $enum:
      - "inactive"
      - "active"
  - events:
    - $key: "events"
    - $tso:
      - type:
        - $enum:
          - "deactivated"
          - "activated"
- ble_tags:
  - addr:
  - rssi:
  - voltage:
    - $div: 100
    - $fpp: 2
  - temperature:
    - measurements:
      - $tsp:
        - min:
          - $div: 100
          - $fpp: 2
        - max:
          - $div: 100
          - $fpp: 2
        - avg:
          - $div: 100
          - $fpp: 2
        - mdn:
          - $div: 100
          - $fpp: 2
  - humidity:
    - measurements:
      - $tsp:
        - min:
          - $div: 100
          - $fpp: 2
        - max:
          - $div: 100
          - $fpp: 2
        - avg:
          - $div: 100
          - $fpp: 2
        - mdn:
          - $div: 100
          - $fpp: 2
